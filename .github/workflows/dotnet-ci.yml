name: .NET 8 CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore $(find . -name "*.sln" | head -n 1)

    - name: Build solution
      run: dotnet build $(find . -name "*.sln" | head -n 1) --configuration Release --no-restore

    - name: Run xUnit Tests
      run: dotnet test $(find . -name "*.sln" | head -n 1) --configuration Release --no-build
